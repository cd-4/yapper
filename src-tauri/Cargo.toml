[package]
name = "blitzen"
version = "0.1.0"
description = "A Git-friendly yapitest API testing UI"
authors = ["Blitzen"]
edition = "2021"

[lib]
name = "blitzen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
