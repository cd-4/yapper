[package]
name = "yapper"
version = "0.1.0"
description = "A Git-friendly yapitest API testing UI"
authors = ["Yapper"]
edition = "2021"

[lib]
name = "yapper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
yapitest = "1.0"
